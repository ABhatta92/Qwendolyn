[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwendolyn"
version = "0.1.0"
description = "A local LLM agent powered by Ollama and LangChain"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abhiroop Bhattacharya" }
]

dependencies = [
    # LLM
    "ollama>=0.5.0",
    "langchain>=0.3.27",
    "langchain-core>=0.3.70",
    "langchain-ollama>=0.3.6",

    # UI
    "streamlit>=1.48.0",

    # Data
    "pandas>=2.3.0",
    "numpy>=2.3.0",
    "duckdb>=1.3.0",

    # Config
    "python-dotenv>=1.1.0",
    "PyYAML>=6.0.2",

    # Validation
    "pydantic>=2.11.0",

    # Utilities
    "rich>=14.0.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.4.0",
    "black>=25.0.0",
    "ruff>=0.12.0",
    "isort>=6.0.0",
]

docs = [
    "python-docx",
    "pymupdf",
    "openpyxl",
]

ai = [
    "sentence-transformers",
    "faiss-cpu",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["qwendolyn*"]
exclude = [
    "tests*",
    "logs*",
    "venv*",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
python_files = [
    "test_*.py"
]
